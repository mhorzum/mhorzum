name: Windows exe olustur

on:
  push:
    branches: ["**"]
    paths:
      - "autoclicker/**"
      - "main.py"
      - "OtomatikTiklayici.spec"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testleri calistir
        run: python -m unittest discover -s tests -v

      - name: PyInstaller kur
        run: python -m pip install --upgrade pyinstaller

      - name: Paketle
        run: python -m PyInstaller --noconfirm --clean OtomatikTiklayici.spec

      - name: Programi yukle
        uses: actions/upload-artifact@v4
        with:
          name: OtomatikTiklayici
          path: dist/OtomatikTiklayici.exe

      # Son derlemeyi "latest" etiketli surum olarak yayimlar; boylece .exe
      # GitHub'a giris yapmadan tek tikla indirilebilir ve suresi dolmaz.
      - name: Son surumu guncelle
        if: >
          github.ref_type == 'branch' &&
          (github.ref_name == github.event.repository.default_branch ||
           startsWith(github.ref_name, 'claude/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { Write-Host "Onceki 'latest' surumu yok, yenisi olusturulacak." }
          gh release create latest "dist/OtomatikTiklayici.exe" `
            --target $env:GITHUB_SHA `
            --title "Otomatik Tiklayici - son surum" `
            --notes-file ".github/release-notes.md" `
            --latest
