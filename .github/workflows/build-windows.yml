name: Windows exe olustur

on:
  push:
    branches: ["**"]
    paths:
      - "autoclicker/**"
      - "main.py"
      - "OtomatikTiklayici.spec"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testleri calistir
        run: python -m unittest discover -s tests -v

      - name: PyInstaller kur
        run: python -m pip install --upgrade pyinstaller

      - name: Paketle
        run: python -m PyInstaller --noconfirm --clean OtomatikTiklayici.spec

      - name: Programi yukle
        uses: actions/upload-artifact@v4
        with:
          name: OtomatikTiklayici
          path: dist/OtomatikTiklayici.exe
