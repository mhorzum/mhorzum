name: Surum yayimla

# v ile baslayan bir etiket (tag) gonderildiginde .exe derlenir ve
# GitHub Releases sayfasina yuklenir. Boylece dosya giris yapmadan,
# tek tikla indirilebilir.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testleri calistir
        run: python -m unittest discover -s tests -v

      - name: PyInstaller kur
        run: python -m pip install --upgrade pyinstaller

      - name: Paketle
        run: python -m PyInstaller --noconfirm --clean OtomatikTiklayici.spec

      - name: Surumu yayimla
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          "dist/OtomatikTiklayici.exe"
          --title "Otomatik Tiklayici $env:GITHUB_REF_NAME"
          --notes-file ".github/release-notes.md"
